<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quel type de phrase ?</title><style>:root{--blue:#3467d8;--ink:#17233a;--soft:#eef3ff;--ok:#15865d;--bad:#c23b3b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#edf3ff,#fff7e8);color:var(--ink);min-height:100vh}main{max-width:760px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{color:var(--blue);font-weight:750;text-decoration:none}.score{font-weight:800;background:white;padding:9px 14px;border-radius:999px}.card{background:#fff;margin-top:24px;padding:clamp(24px,6vw,48px);border-radius:28px;box-shadow:0 18px 55px #17345d1a;text-align:center}.step{color:#62708a;font-weight:700}.bar{height:10px;background:#e7ebf3;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--blue);transition:.25s}.sentence{font-size:clamp(1.65rem,5vw,2.35rem);font-weight:750;line-height:1.35;margin:42px 0}.choices{display:grid;gap:14px}.choices button,.next{font:inherit;font-weight:800;border-radius:16px;padding:17px;border:2px solid #cad5ef;background:#f8faff;color:var(--ink);cursor:pointer}.choices button:hover,.choices button:focus{border-color:var(--blue);background:var(--soft)}button:disabled{cursor:default}.choices .good{background:#e9f8f1;border-color:var(--ok);color:#08704a}.choices .wrong{background:#fff0f0;border-color:var(--bad);color:#a22a2a}.feedback{min-height:55px;margin:18px 0 8px;font-weight:750;font-size:1.08rem}.explain{display:block;font-weight:500;margin-top:5px}.next{display:none;background:var(--blue);color:white;border-color:var(--blue);width:100%}.result{display:none}small{color:#65738c}</style></head><body><main><div class="top"><a class="back" href="../">← Accueil</a><div class="score">⭐ <span id="score">0</span></div></div><section class="card" id="quiz"><div class="step" id="step"></div><div class="bar"><span id="progress"></span></div><div class="sentence" id="sentence"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next">Phrase suivante →</button></section><section class="card result" id="result"><div style="font-size:4rem">🏆</div><h1>Bravo !</h1><p id="final"></p><button class="next" style="display:block" onclick="location.reload()">Recommencer</button></section></main><script>const data=[['Je recopiais mes devoirs rapidement.','Déclarative','Elle donne une information.'],['Viendras-tu au conservatoire ?','Interrogative','Elle pose une question.'],['Ne courez pas sur la route.','Impérative','Elle donne un ordre ou un conseil.'],['Combien de lettres avez-vous reçues ?','Interrogative','Elle pose une question.'],['Finissez votre travail avant le repas.','Impérative','Elle donne un ordre.'],['Le chaton était sur le canapé.','Déclarative','Elle donne une information.'],['Les saris indiens sont colorés.','Déclarative','Elle donne une information.'],['Cet engin peut-il rouler ?','Interrogative','Elle pose une question.'],['Les éléphants ne sont pas dans ce zoo.','Déclarative','Elle donne une information.'],['Les Jeux olympiques se dérouleront au Japon.','Déclarative','Elle donne une information.']];const labels=['Déclarative','Interrogative','Impérative'];let i=0,score=0,locked=false;const $=id=>document.getElementById(id);function show(){locked=false;$('step').textContent=`Phrase ${i+1} sur ${data.length}`;$('progress').style.width=`${i/data.length*100}%`;$('sentence').textContent=data[i][0];$('feedback').innerHTML='';$('next').style.display='none';$('choices').innerHTML='';labels.forEach(l=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>answer(b,l);$('choices').appendChild(b)})}function answer(btn,l){if(locked)return;locked=true;let ok=l===data[i][1];if(ok)score++;$('score').textContent=score;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===data[i][1])b.classList.add('good')});if(!ok)btn.classList.add('wrong');$('feedback').innerHTML=(ok?'✅ Bonne réponse !':`💡 La bonne réponse est « ${data[i][1]} ».`)+`<span class="explain">${data[i][2]}</span>`;$('next').style.display='block'}$('next').onclick=()=>{i++;if(i<data.length)show();else{$('quiz').style.display='none';$('result').style.display='block';$('final').textContent=`Tu as obtenu ${score} bonne${score>1?'s':''} réponse${score>1?'s':''} sur ${data.length}.`;}};show();</script></body></html>
