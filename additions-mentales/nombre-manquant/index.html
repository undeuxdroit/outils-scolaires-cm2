<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le nombre manquant jusqu'à 20</title><link rel="stylesheet" href="../app.css"></head><body><main class="app"><nav class="top"><a class="home" href="../">← Les 2 jeux</a><span class="count"></span><button class="reset" onclick="restart()">Recommencer</button></nav><div class="progress"><div class="bar"></div></div><section class="card quiz"><h1>Trouve le nombre manquant</h1><div class="sum"><span class="first"></span><span>+</span><input class="answer" inputmode="numeric" pattern="[0-9]*" aria-label="Le nombre manquant" maxlength="2"><span>=</span><span class="result"></span></div><div class="actions"><button class="hint">Un indice</button><button class="check">Je vérifie</button></div><p class="feedback" aria-live="polite"></p><button class="next">Question suivante →</button><div class="dots"></div></section><section class="card summary"><h2>Entraînement terminé !</h2><p class="score"></p><p class="message"></p><button class="restart">Recommencer</button></section></main><script>window.showQuestion=q=>{document.querySelector('.first').textContent=q.a;document.querySelector('.result').textContent=q.result};window.correctAnswer=q=>q.b;window.explain=q=>`${q.a} + ${q.b} = ${q.result}. Le nombre manquant est ${q.b}.`;window.hint=q=>`Pars de ${q.a} et compte jusqu’à ${q.result}.`</script><script src="../app.js"></script></body></html>
