<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Additions rapides jusqu'à 20</title><link rel="stylesheet" href="../app.css"></head><body><main class="app"><nav class="top"><a class="home" href="../">← Les 2 jeux</a><span class="count"></span><button class="reset" onclick="restart()">Recommencer</button></nav><div class="progress"><div class="bar"></div></div><section class="card quiz"><h1>Calcule l’addition</h1><div class="sum"><span class="first"></span><span>+</span><span class="second"></span><span>=</span><input class="answer" inputmode="numeric" pattern="[0-9]*" aria-label="Ta réponse" maxlength="2"></div><div class="actions"><button class="hint">Un indice</button><button class="check">Je vérifie</button></div><p class="feedback" aria-live="polite"></p><button class="next">Question suivante →</button><div class="dots"></div></section><section class="card summary"><h2>Entraînement terminé !</h2><p class="score"></p><p class="message"></p><button class="restart">Recommencer</button></section></main><script>window.showQuestion=q=>{document.querySelector('.first').textContent=q.a;document.querySelector('.second').textContent=q.b};window.correctAnswer=q=>q.result;window.explain=q=>`${q.a} + ${q.b} = ${q.result}.`;window.hint=q=>`Pars de ${Math.max(q.a,q.b)} et avance de ${Math.min(q.a,q.b)}.`</script><script src="../app.js"></script></body></html>
