<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tables, doubles et moitiés · Gabin</title><meta name="description" content="Les exercices de la leçon : tables de 2 à 9, doubles et moitiés. Une question à la fois, à ton rythme."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232455bd'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='48' fill='white'%3E×%3C/text%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182b49;background:#f0f5fc;font-size:18px}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:24px 20px 40px}a{color:#2455bd}header{display:flex;justify-content:space-between;gap:15px;align-items:center;font-size:.85rem}h1{font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:-.04em;margin:26px 0 8px}p{line-height:1.6}button,select,input{font:inherit}button,select{min-height:48px;border:1px solid #bbcce4;background:white;border-radius:12px;padding:10px 16px;color:inherit}button{cursor:pointer;font-weight:650}button:hover{background:#e9f0fc}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #c27800;outline-offset:4px}.tabs{display:flex;gap:8px;margin:23px 0 18px}.tabs button{flex:1}.tabs button[aria-pressed=true]{background:#2455bd;border-color:#2455bd;color:white}.settings{display:flex;gap:15px;flex-wrap:wrap;align-items:end;margin-bottom:20px}.settings label{display:grid;gap:7px;font-size:.85rem;flex:1;min-width:190px}.sheet{background:#fff;border:1px solid #d9e3f2;border-radius:22px;box-shadow:0 8px 30px #163a7510;overflow:hidden}.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#f8faff;border-bottom:1px solid #e1e9f5}.nav button{font-size:1.3rem;min-width:55px}.nav span{font-size:.85rem;text-align:center}article{text-align:center;padding:26px 22px 20px}.eyebrow{font-size:.85rem;color:#536982;margin:0 0 15px}.question{font-size:clamp(2rem,7vw,3rem);font-weight:750;line-height:1.3;margin:12px 0 25px}.answer-row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}input{width:180px;min-height:64px;border:2px solid #8aa7ce;border-radius:12px;text-align:center;font-size:1.8rem;color:#182b49}label[for=answer]{display:block;margin-bottom:10px}.primary{background:#2455bd;color:white;border-color:#2455bd;min-height:60px}.primary:hover{background:#193f94}.feedback{padding:16px;border-radius:12px;background:#edf4ff;margin:18px auto 0;max-width:570px;text-align:left;line-height:1.55}.feedback.good{background:#e6f6ef;color:#15513b}.feedback.try{background:#fff4db;color:#644712}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}.progress{font-size:.85rem;color:#536982;padding:16px 22px;border-top:1px solid #e1e9f5;text-align:center}details{margin-top:20px;background:white;border:1px solid #d9e3f2;border-radius:14px;padding:18px}summary{cursor:pointer;font-weight:650;min-height:28px}.lesson-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;list-style:none;padding:0}.lesson-list li{padding:8px;background:#f2f6fc;border-radius:7px;font-variant-numeric:tabular-nums}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:center;margin:15px 0}td,th{padding:9px;border:1px solid #d4e0f1}th{background:#2455bd;color:white}footer{font-size:.8rem;color:#536982;margin-top:22px;text-align:center}[hidden]{display:none!important}@media(max-width:480px){main{padding:18px 12px}.tabs{gap:5px}.tabs button{padding:10px 7px;font-size:.92rem}article{padding:22px 14px}.settings{gap:12px}.nav{padding:12px}header{font-size:.78rem}td,th{padding:7px}}
</style></head><body><main><header><a href="../">Toutes les activités de Gabin</a><span>CALCUL MENTAL · CM2</span></header><h1>Tables, doubles et moitiés</h1><p style="margin:0;color:#536982">Une question à la fois. Prends ton temps.</p><nav class="tabs" aria-label="Choisir une leçon"><button data-mode="tables" aria-pressed="true">Tables ×</button><button data-mode="doubles" aria-pressed="false">Doubles</button><button data-mode="moities" aria-pressed="false">Moitiés</button></nav><div class="settings"><label><span id="filter-label">Choisis une table</span><select id="filter"></select></label><label>Ordre des questions<select id="order"><option value="ordered">Dans l’ordre de la leçon</option><option value="random">Dans le désordre</option></select></label></div><section class="sheet" aria-label="Entraînement"><div class="nav"><button id="prev" aria-label="Question précédente">←</button><span id="position"></span><button id="next" aria-label="Question suivante">→</button></div><article><p class="eyebrow" id="instruction"></p><div class="question" id="question"></div><form id="form"><label for="answer">Ta réponse</label><div class="answer-row"><input id="answer" inputmode="numeric" autocomplete="off" aria-describedby="feedback" maxlength="8"><button class="primary" id="check" type="submit">Vérifier</button></div></form><div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div><div class="actions"><button id="solution">Voir la correction</button><button id="continue" hidden>Continuer</button></div></article><div class="progress" id="progress"></div></section><details id="lesson"><summary>Revoir la leçon</summary><div id="lesson-body"></div></details><footer>Les nombres et les tables de ta fiche « Je mémorise » · Sans chronomètre</footer></main><script>
'use strict';
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('fr-FR');
const small=Array.from({length:20},(_,i)=>i+1),largeD=[20,25,30,35,40,45,50,60,75,100,150,200,250,300,400,500,600,1000],largeH=[50,60,70,80,90,100,120,150,200,300,400,500,600,800,1000,1200];
let mode='tables',questions=[],index=0;
function pool(){if(mode==='tables'){let rows=$('filter').value==='all'?[2,3,4,5,6,7,8,9]:[Number($('filter').value)];return rows.flatMap(a=>Array.from({length:8},(_,i)=>({a,b:i+2,result:a*(i+2)})));}let nums=mode==='doubles'?($('filter').value==='1'?small:largeD):($('filter').value==='1'?small.map(n=>n*2):largeH);return nums.map(a=>({a,result:mode==='doubles'?a*2:a/2}));}
function configure(){ $('filter-label').textContent=mode==='tables'?'Choisis une table':'Choisis une partie';$('filter').innerHTML=mode==='tables'?'<option value="all">Toutes les tables (2 à 9)</option>'+[2,3,4,5,6,7,8,9].map(n=>`<option value="${n}">Table de ${n}</option>`).join(''):'<option value="1">Partie 1 · Petits nombres</option><option value="2">Partie 2 · Grands nombres</option>';start();}
function start(){questions=pool().map(q=>({...q,answer:'',status:'',message:'',revealed:false}));if($('order').value==='random')for(let i=questions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]];}index=0;$('lesson').open=false;renderLesson();render();}
function explanation(q){if(mode==='tables')return `${q.a} × ${q.b} = ${fmt(q.result)}. On additionne ${q.a} fois le nombre ${q.b}. Et ${q.b} × ${q.a} donne aussi ${fmt(q.result)} : on peut échanger les deux nombres.`;if(mode==='doubles')return `Le double de ${fmt(q.a)}, c’est deux fois ce nombre : ${fmt(q.a)} + ${fmt(q.a)} = ${fmt(q.result)}.`;return `La moitié de ${fmt(q.a)}, c’est partager en deux parts égales : ${fmt(q.a)} ÷ 2 = ${fmt(q.result)}. Pour vérifier : ${fmt(q.result)} + ${fmt(q.result)} = ${fmt(q.a)}.`;}
function render(){let q=questions[index];$('position').textContent=`Question ${index+1} sur ${questions.length}`;$('prev').disabled=index===0;$('next').disabled=index===questions.length-1;$('instruction').textContent=mode==='tables'?'Calcule le résultat.':mode==='doubles'?'Trouve deux fois ce nombre.':'Partage ce nombre en deux parts égales.';$('question').textContent=mode==='tables'?`${q.a} × ${q.b} = ?`:`${mode==='doubles'?'Double':'Moitié'} de ${fmt(q.a)} ?`;$('answer').value=q.answer;$('answer').disabled=q.status==='good'||q.revealed;$('check').disabled=$('answer').disabled;$('feedback').hidden=!q.message;$('feedback').textContent=q.message;$('feedback').className='feedback '+q.status;$('solution').hidden=q.status==='good'||q.revealed;$('continue').hidden=!(q.status==='good'||q.revealed);$('continue').textContent=index===questions.length-1?'Recommencer la série':'Continuer';const solved=questions.filter(q=>q.status==='good').length,seen=questions.filter(q=>q.revealed).length;$('progress').textContent=`${solved} réponse${solved>1?'s':''} trouvée${solved>1?'s':''} sur ${questions.length}${seen?' · '+seen+' correction'+(seen>1?'s':'')+' consultée'+(seen>1?'s':''):''}`;}
function move(delta){index=Math.max(0,Math.min(questions.length-1,index+delta));render();}
$('answer').addEventListener('input',()=>{questions[index].answer=$('answer').value;});$('form').addEventListener('submit',e=>{e.preventDefault();let q=questions[index],raw=$('answer').value.replace(/\s/g,'');if(!/^\d+$/.test(raw)){q.message='Écris un nombre dans la case, puis appuie sur Vérifier.';q.status='try';}else if(Number(raw)===q.result){q.status='good';q.message='Bravo ! '+explanation(q);}else{q.status='try';q.message=mode==='tables'?'Essaie encore. Tu peux additionner plusieurs fois le même nombre.':mode==='doubles'?'Essaie encore. Additionne ce nombre avec lui-même.':'Essaie encore. Cherche deux nombres identiques qui, additionnés, donnent ce nombre.';}render();if(q.status==='try'){$('answer').focus();$('answer').select();}});
$('solution').onclick=()=>{let q=questions[index];q.revealed=true;q.status='';q.message=explanation(q);render();};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('continue').onclick=()=>index===questions.length-1?start():move(1);$('filter').onchange=start;$('order').onchange=start;document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));configure();});
function renderLesson(){let html;if(mode==='tables'){html='<p>Si je connais 8 × 3, alors je connais 3 × 8 : le résultat est le même.</p><div class="table-wrap"><table><caption>Les tables de 2 à 9</caption><thead><tr><th scope="col">×</th>'+[2,3,4,5,6,7,8,9].map(n=>`<th scope="col">${n}</th>`).join('')+'</tr></thead><tbody>'+[2,3,4,5,6,7,8,9].map(a=>`<tr><th scope="row">${a}</th>`+[2,3,4,5,6,7,8,9].map(b=>`<td>${a*b}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';}else{html=`<p>${mode==='doubles'?'Pour trouver le double, j’ajoute le nombre à lui-même.':'Pour trouver la moitié, je partage en deux parts égales.'}</p><ul class="lesson-list">`+pool().map(q=>`<li>${mode==='doubles'?'Double':'Moitié'} de ${fmt(q.a)} = <strong>${fmt(q.result)}</strong></li>`).join('')+'</ul>';} $('lesson-body').innerHTML=html;}
configure();
</script></body></html>
