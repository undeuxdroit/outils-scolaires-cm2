<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quel signe à la fin ?</title><style>:root{--violet:#7750d8;--ink:#17233a;--ok:#15865d;--bad:#c23b3b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#f2ecff,#ecfbf6);color:var(--ink);min-height:100vh}main{max-width:760px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:var(--violet);font-weight:750;text-decoration:none}.score{font-weight:800;background:white;padding:9px 14px;border-radius:999px}.card{background:#fff;margin-top:24px;padding:clamp(24px,6vw,48px);border-radius:28px;box-shadow:0 18px 55px #32175d1a;text-align:center}.step{color:#62708a;font-weight:700}.bar{height:10px;background:#e7ebf3;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--violet);transition:.25s}.sentence{font-size:clamp(1.55rem,5vw,2.25rem);font-weight:750;line-height:1.4;margin:42px 0}.blank{display:inline-block;color:var(--violet);border-bottom:4px solid var(--violet);min-width:28px}.choices{display:flex;justify-content:center;gap:16px}.choices button{font:900 2.2rem system-ui;width:86px;height:76px;border:2px solid #d3c9ee;border-radius:18px;background:#faf8ff;cursor:pointer}.choices button:hover,.choices button:focus{border-color:var(--violet);transform:scale(1.04)}button:disabled{cursor:default}.choices .good{background:#e9f8f1;border-color:var(--ok);color:var(--ok)}.choices .wrong{background:#fff0f0;border-color:var(--bad);color:var(--bad)}.feedback{min-height:64px;margin:18px 0 8px;font-weight:750;font-size:1.08rem}.explain{display:block;font-weight:500;margin-top:5px}.next{display:none;font:inherit;font-weight:800;border:0;border-radius:16px;padding:17px;background:var(--violet);color:white;width:100%;cursor:pointer}.result{display:none}</style></head><body><main><div class="top"><a class="back" href="../">← Accueil</a><div class="score">⭐ <span id="score">0</span></div></div><section class="card" id="quiz"><div class="step" id="step"></div><div class="bar"><span id="progress"></span></div><div class="sentence"><span id="sentence"></span><span class="blank" id="mark">…</span></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next">Phrase suivante →</button></section><section class="card result" id="result"><div style="font-size:4rem">🎉</div><h1>Excellent travail !</h1><p id="final"></p><button class="next" style="display:block" onclick="location.reload()">Recommencer</button></section></main><script>const data=[['Ne roule pas dans les plates-bandes','!','C’est un ordre : le point d’exclamation convient.'],['Avais-tu pris ton goûter','?','C’est une question : elle se termine par un point d’interrogation.'],['Le bateau arrive au port','.','C’est une information : elle se termine par un point.'],['Le lapin ne mange pas d’insectes','.','C’est une information : elle se termine par un point.'],['Le ministre arrive-t-il à neuf heures','?','C’est une question : elle se termine par un point d’interrogation.'],['Sois à l’heure demain matin','!','C’est un ordre : le point d’exclamation convient.']];let i=0,score=0,locked=false;const $=id=>document.getElementById(id);function show(){locked=false;$('step').textContent=`Phrase ${i+1} sur ${data.length}`;$('progress').style.width=`${i/data.length*100}%`;$('sentence').textContent=data[i][0];$('mark').textContent='…';$('feedback').innerHTML='';$('next').style.display='none';$('choices').innerHTML='';['.','?','!'].forEach(l=>{let b=document.createElement('button');b.textContent=l;b.setAttribute('aria-label',l==='.'?'point':l==='?'?'point d’interrogation':'point d’exclamation');b.onclick=()=>answer(b,l);$('choices').appendChild(b)})}function answer(btn,l){if(locked)return;locked=true;let ok=l===data[i][1];if(ok)score++;$('score').textContent=score;$('mark').textContent=data[i][1];[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===data[i][1])b.classList.add('good')});if(!ok)btn.classList.add('wrong');$('feedback').innerHTML=(ok?'✅ Bonne réponse !':`💡 Il fallait choisir « ${data[i][1]} ».`)+`<span class="explain">${data[i][2]}</span>`;$('next').style.display='block'}$('next').onclick=()=>{i++;if(i<data.length)show();else{$('quiz').style.display='none';$('result').style.display='block';$('final').textContent=`Tu as obtenu ${score} bonne${score>1?'s':''} réponse${score>1?'s':''} sur ${data.length}.`;}};show();</script></body></html>
